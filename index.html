<!-- REQUISITI FUNZIONALI ORIGINALI
# Requisiti funzionali

## 2. Esecuzione in palestra

Deve essere possibile registrare il completamento dell'esercizio

Un esercizio deve poter essere segnato come completato, parziale o saltato. gli esercizi saltati non impediscono il completamento della sessione ma non partecipano alla progressione.

Il pulsante «Completa sessione» deve mostrare un riepilogo degli esercizi non completati e chiedere conferma; un doppio clic non deve generare due completamenti o due progressioni.

Deve essere possibile annullare una spunta e, con una conferma, riaprire una sessione completata correggendo coerentemente lo storico e la progressione.

Per il recupero tra serie, aggiungi un timer avviabile con un tocco, con possibilità di metterlo in pausa, riavviarlo o ignorarlo.

- Deve essere possibile utilizzare la scheda quando si va in palestra, selezionando delle checkbox sugli esercizi fatti per tracciare quello che deve essere ancora fatto in quella sessione. Cliccare sulla checkbox scurisce graficamente l’esercizio.

- Quando si completa un esercizio (cliccando su ogni esercizio della scheda stessa), si deve avviare il sistema di progressione, che deve cambiare la configurazione della scheda secondo le regole e la priorità definita.

farei della sessione svolta un’istantanea immutabile di quanto era previsto e di quanto è stato realmente eseguito; solo dopo la sua conferma aggiornerei la scheda per la prossima volta. Questo rende comprensibili storico, correzioni e progressione anche quando cambi esercizi o carichi.

- --

## 3. Progressione: regole verificabili

La progressione deve essere calcolata al completamento di un esercizio; incremento_dopo_numero_esercizi conta quelle in cui è stato effettivamente completato il singolo esercizio.

si applica un solo parametro («parametro attivo» nel JSON) per tutti gli esercizi, ed è l'utente a scegliere quale parametro allenante allenare. La progressione deve essere configurabile nell’indicare quale parametro allenante potenziare in un determinato periodo, e per quanto tempo.

Per le ripetizioni, gli incrementi al passo successivo sono in ordine: per esempio, dopo 10-10-10 → 12-10-10, poi 12-12-10.

il valore minimo di ogni chiave numerica del json deve essere zero, così non si arriva mai a valori negativi.

Gli esercizi Devono poter essere esclusi dalla progressione

esercizi con lo stesso nome in giorni diversi condividono lo stato di progressione solo se hanno lo stesso id.

- L’applicazione dovrà gestire in autonomia la progressione.

- La progressione deve avvenire potenzialmente tramite 3 parametri allenanti:
  - l’aumento di volume: aumento del numero di ripetizioni (+1 oppure +N ripetizioni dentro una serie); nel json, "incremento_ripetizione" indica di quante ripetizioni deve aumentare un esercizio (ad esempio "incremento_ripetizione": 2, in una serie 10-10-10, diventa 12-10-10, nel caso "incremento_numero_ripetizioni_nella_serie": 1. Se "incremento_numero_ripetizioni_nella_serie":2, sarebbe stato un incremento di 12-12-10, e cosi via); "incremento_dopo_numero_sessioni" indica dopo quante sessioni di allenamento completate scatta la progressione e quindi la modifica dell'esercizio.
  - tramite l’aumento dei carichi (+kilogrammi); "incremento_dopo_numero_esercizi" indica dopo quante sessioni di allenamento completate scatta la progressione e quindi la modifica dell'esercizio.
  - tramite la diminuizione del tempo di recupero tra le serie; "incremento_dopo_numero_esercizi" indica dopo quante sessioni di allenamento completate scatta la progressione e quindi la modifica dell'esercizio.

- --

## 4. Modifiche, import/export e affidabilità

L’import deve validare il JSON prima di sostituire i dati, mostrare gli errori in modo comprensibile e offrire la scelta fra sostituire la scheda e conservarne una copia. L’export deve includere scheda, stato di progressione e storico.

Ogni esercizio e sessione dovrebbe avere un ID stabile, indipendente da nome e posizione: così rinominare o riordinare un esercizio non ne perde lo storico.

Salvataggio automatico dopo ogni modifica, indicazione visibile dell’esito, backup esportabile e ripristino: sono particolarmente importanti se l’app deve funzionare durante l’allenamento.

l’HTML unico viene aperto direttamente come file locale

- Deve essere possibile effettuare import ed export della scheda attuale, in formato json

- Deve essere possibile cambiare facilmente l’ordine degli esercizi, intervenendo in tempo reale anche sulla UI per quanto riguarda l’ordine.

- Deve essere possibile modificare qualunque cosa di un esercizio, tranne l'ID. Il sistema di progressione si dovrà adattare e funzionare sulle modifiche effettuate dall’utente.

- --

## 5. Modello dati

i dati dell'applicazione (scheda allenamento) devono essere in formato json embeddati dentro l'html, e sono gli unici punti dove il dato deve essere immagazzinato, modificato, cancellato o aggiunto.

- Per ogni esercizio deve essere possibile cliccare sull’esercizio per aprire un video di YouTube per vedere come svolgere l’esercizio.

- --

## 7. Interfaccia, compatibilità e tecnologia

- L’interfaccia deve essere funzionante su mobile e su ipad, ma deve essere gestita l’interfaccia anche per il computer.

- Non hai vincoli di librerie javascript, codice o altro.

- L’interfaccia deve essere molto smart, molto veloce e molto usabile.

- In formato commento, tutti i requisiti funzionali dell'applicazione devono essere embeddati dentro l'html.

<script>
'use strict';
const KEY='forma.allenamento.v1';
const EMBEDDED=JSON.parse(document.getElementById('embedded-data').textContent);
const clone=x=>JSON.parse(JSON.stringify(x));

const uid=()=>globalThis.crypto?.randomUUID?.()||'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
const zero=x=>Math.max(0,Number(x)||0);
const reps=x=>Array.isArray(x)?x:[x];
function validate(raw){

 if(!prog||typeof prog!=='object')err('scheda.progressione','oggetto obbligatorio');
 else {if(!['volume','carico','recupero'].includes(prog.parametro_attivo))err('progressione.parametro_attivo','scegli volume, carico o recupero');
 for(const [kind,keys] of Object.entries({volume:['incremento_numero_ripetizioni_nella_serie','incremento_ripetizione'],carico:['incremento_kg'],recupero:['riduzione_secondi']})){

 for(const k of keys)if(!nonneg(p[k]))err('progressione.'+kind+'.'+k,'numero non negativo');
 if(!nonneg(p.incremento_dopo_numero_esercizi)&&!nonneg(p.incremento_dopo_numero_sessioni))err('progressione.'+kind,'serve una soglia non negativa');
 }}
 const dayids=new Set();if(Array.isArray(s.giorni))s.giorni.forEach((d,i)=>{let path='giorni['+i+']';if(!d||typeof d!=='object'){err(path,'oggetto obbligatorio');return}
 if(typeof d.id!=='string'||!d.id.trim()||dayids.has(d.id))err(path+'.id','ID giornata mancante o duplicato');dayids.add(d.id);
 if(typeof d.giorno!=='string')err(path+'.giorno','serve testo');if(!Array.isArray(d.focus)||d.focus.some(x=>typeof x!=='string'))err(path+'.focus','serve una lista di testi');
 if(!Array.isArray(d.esercizi)){err(path+'.esercizi','serve una lista');return}const seen=new Set();d.esercizi.forEach((e,j)=>{let q=path+'.esercizi['+j+']';if(!e||typeof e!=='object'){err(q,'oggetto obbligatorio');return}
 if(typeof e.id!=='string'||!e.id.trim()||seen.has(e.id))err(q+'.id','ID mancante o ripetuto nella giornata');seen.add(e.id);
 for(const k of ['nome','descrizione','focus_muscoli_primario','focus_muscoli_secondario','note_impostazioni_macchinario_esercizio','link_video'])if(typeof e[k]!=='string')err(q+'.'+k,'serve testo');
 if(!nonneg(e.ordine)||!nonneg(e.carico)||!nonneg(e.recupero_secondi))err(q,'ordine, carico e recupero devono essere non negativi');
 if(!(nonneg(e.ripetizioni)||(Array.isArray(e.ripetizioni)&&e.ripetizioni.length>0&&e.ripetizioni.every(nonneg))))err(q+'.ripetizioni','numero o lista non vuota di numeri non negativi');
 if(e.escludi_progressione!==undefined&&typeof e.escludi_progressione!=='boolean')err(q+'.escludi_progressione','serve vero o falso');
 });});
 if(raw.storico!==undefined&&!Array.isArray(raw.storico))err('storico','serve una lista');
 if(raw.sessione_attiva!==undefined&&raw.sessione_attiva!==null&&typeof raw.sessione_attiva!=='object')err('sessione_attiva','serve un oggetto o null');
 function numbers(obj,path,depth=0){if(depth>30){err(path,'struttura troppo profonda');return}if(obj&&typeof obj==='object')for(const [k,v] of Object.entries(obj)){if(typeof v==='number'&&!nonneg(v))err(path+'.'+k,'numero negativo o non valido');else if(v&&typeof v==='object')numbers(v,path+'.'+k,depth+1)}}numbers(raw,'JSON');
 return errors.slice(0,35);
}
function normalize(raw){let v=clone(raw);if(!v.scheda)throw Error('Manca scheda');v.storico??=[];v.copie??=[];v.sessione_attiva??=null;v.meta??={};v.periodo??={durata_sessioni:0,completate:0};
 for(const k of ['volume','carico','recupero']){let p=v.scheda.progressione[k];p.incremento_dopo_numero_esercizi??=p.incremento_dopo_numero_sessioni??1;p.incremento_dopo_numero_sessioni??=p.incremento_dopo_numero_esercizi}
 v.scheda.stato_progressione??={totale_sessioni_completate:0,sessione_corrente:0};return v}
let state;try{const stored=localStorage.getItem(KEY);let raw=stored?JSON.parse(stored):EMBEDDED;let errors=validate(raw);if(errors.length)throw Error(errors.join('; '));state=normalize(raw)}catch(e){state=normalize(EMBEDDED);setTimeout(()=>alert('I dati salvati non sono leggibili: caricata la scheda incorporata. Prima di salvare, esporta eventuali backup disponibili. '+e.message),0)}
let selected=state.scheda.giorni[0].id, timer={id:null,remaining:0,total:0,until:0,running:false,label:''}, locked=false;
const $=id=>document.getElementById(id);
function persist(){try{let errors=validate(state);if(errors.length)throw Error(errors.join('; '));localStorage.setItem(KEY,JSON.stringify(state));$('saveStatus').textContent='Salvato sul dispositivo · '+new Date().toLocaleTimeString('it-IT');$('saveStatus').className='save';return true}catch(e){$('saveStatus').textContent='Salvataggio non riuscito: esporta un backup';$('saveStatus').className='save error';alert('Impossibile salvare: '+e.message);return false}}
function notify(msg){let t=$('toast');t.textContent=msg;t.style.display='block';clearTimeout(notify.timeout);notify.timeout=setTimeout(()=>t.style.display='none',2600)}
function day(){return state.scheda.giorni.find(d=>d.id===selected)||state.scheda.giorni[0]}
function session(){let a=state.sessione_attiva;if(a&&a.giorno_id===selected)return a;return null}
function statusFor(e){return session()?.esiti?.[e.id]||'da_fare'}
function startSession(){let d=day();let a={id:uid(),giorno_id:d.id,inizio:new Date().toISOString(),previsto:clone(d),esiti:{}};state.sessione_attiva=a;persist();return a}
function ensureSession(){if(state.sessione_attiva&&state.sessione_attiva.giorno_id!==selected){alert('Concludi o annulla prima la sessione aperta in '+state.sessione_attiva.previsto.giorno+'.');return null}return state.sessione_attiva||startSession()}
function currentExercises(){return session()?.previsto.esercizi||day().esercizi}
function video(url){try{let u=new URL(url);return u.protocol==='https:'&&(['youtube.com','www.youtube.com','m.youtube.com','youtu.be'].includes(u.hostname))?u.href:null}catch{return null}}
function render(){let d=day(),a=session(),xs=currentExercises(),active=state.scheda.progressione.parametro_attivo,period=state.periodo;
 $('appname').textContent=state.scheda.nome;$('days').innerHTML=state.scheda.giorni.map(g=>`<button class="daybtn ${g.id===selected?'active':''}" data-action="day" data-id="${esc(g.id)}"><b>${esc(g.giorno)}</b><small>${esc(g.focus.join(' · '))}</small></button>`).join('');
 $('daycode').textContent='GIORNO '+d.id;$('dayname').textContent=d.giorno;$('dayfocus').textContent=d.focus.join(' · ');
 let done=xs.filter(e=>statusFor(e)==='completato').length,remaining=xs.filter(e=>statusFor(e)==='da_fare').length;
 $('stats').innerHTML=`<div class="stat"><strong>${done} / ${xs.length}</strong><span>Completati</span></div><div class="stat"><strong>${remaining}</strong><span>Da fare</span></div><div class="stat"><strong>${esc(active)}</strong><span>Parametro attivo</span></div><div class="stat"><strong>${state.storico.length}</strong><span>Sessioni nello storico</span></div>`;
 let expired=period.durata_sessioni>0&&period.completate>=period.durata_sessioni;
 $('notice').innerHTML=(a?`<div class="notice">Sessione in corso dal ${esc(new Date(a.inizio).toLocaleString('it-IT'))}. Il programma previsto resta congelato fino alla conferma; le modifiche alla scheda valgono dalla prossima sessione.</div>`:'')+(expired?'<div class="notice warning">Periodo di progressione concluso: scegli un nuovo parametro o una nuova durata per riprendere gli incrementi.</div>':'');
 $('list').innerHTML=xs.map((e,i)=>{let st=statusFor(e),r=reps(e.ripetizioni),link=video(e.link_video);return `<article class="card ${st==='completato'?'done':''}"><div class="cardhead"><input class="check" type="checkbox" aria-label="Completa ${esc(e.nome)}" data-action="check" data-id="${esc(e.id)}" ${st==='completato'?'checked':''}><div class="grow"><div class="row"><span class="title">${i+1}. ${esc(e.nome)}</span><span class="badge ${st==='completato'?'done':st==='saltato'?'skip':st==='parziale'?'partial':''}">${({da_fare:'Da fare',completato:'Completato',parziale:'Parziale',saltato:'Saltato'})[st]}</span></div><div class="meta">${r.length} ${r.length===1?'serie':'serie'} · ${esc(r.join(' / '))} rip. · ${esc(e.carico)} kg · ${esc(e.recupero_secondi)} s recupero ${e.escludi_progressione?'· progressione esclusa':''}</div>${e.descrizione?`<p class="desc">${esc(e.descrizione)}</p>`:''}${e.note_impostazioni_macchinario_esercizio?`<p class="desc">Impostazioni: ${esc(e.note_impostazioni_macchinario_esercizio)}</p>`:''}${e.focus_muscoli_primario||e.focus_muscoli_secondario?`<p class="meta">Focus: ${esc([e.focus_muscoli_primario,e.focus_muscoli_secondario].filter(Boolean).join(' · '))}</p>`:''}</div></div><div class="actions"><button class="small" data-action="status" data-id="${esc(e.id)}" data-status="parziale">Parziale</button><button class="small" data-action="status" data-id="${esc(e.id)}" data-status="saltato">Salta</button>${link?`<button class="small" data-action="video" data-id="${esc(e.id)}">▶ Video</button>`:''}<button class="small" data-action="timer" data-id="${esc(e.id)}" ${e.recupero_secondi===0?'disabled':''}>◷ Recupero</button><button class="small" data-action="edit" data-id="${esc(e.id)}">Modifica</button><button class="small" data-action="move" data-id="${esc(e.id)}" data-dir="-1" ${a||i===0?'disabled':''} aria-label="Sposta su">↑</button><button class="small" data-action="move" data-id="${esc(e.id)}" data-dir="1" ${a||i===xs.length-1?'disabled':''} aria-label="Sposta giù">↓</button></div></article>`}).join('')||'<div class="panel">Nessun esercizio. Aggiungine uno per iniziare.</div>';
}
function setStatus(id,status){let a=ensureSession();if(!a)return;if(!a.previsto.esercizi.some(e=>e.id===id))return;a.esiti[id]=status;persist();render();if(status==='completato'){let e=a.previsto.esercizi.find(e=>e.id===id);let active=state.scheda.progressione.parametro_attivo;notify(e.escludi_progressione?'Completato · escluso dalla progressione':'Completato · '+active+' calcolato alla conferma')}}
function threshold(p){return Math.max(1,Math.floor(p.incremento_dopo_numero_esercizi??p.incremento_dopo_numero_sessioni??1))}
function applyProgress(a){let p=state.scheda.progressione,kind=p.parametro_attivo,expired=state.periodo.durata_sessioni>0&&state.periodo.completate>=state.periodo.durata_sessioni,events=[];
 if(expired)return events;let ids=[...new Set(a.previsto.esercizi.filter(e=>a.esiti[e.id]==='completato'&&!e.escludi_progressione).map(e=>e.id))];
 for(let id of ids){let m=state.meta[id]??={volume:{count:0,cursor:0},carico:{count:0},recupero:{count:0}};m[kind]??={count:0,cursor:0};let t=m[kind];t.count=(t.count||0)+1;if(t.count<threshold(p[kind]))continue;t.count=0;
 let affected=state.scheda.giorni.flatMap(d=>d.esercizi.filter(e=>e.id===id&&!e.escludi_progressione));if(!affected.length)continue;
 let before=affected.map(e=>({giorno:state.scheda.giorni.find(d=>d.esercizi.includes(e)).id,ripetizioni:clone(e.ripetizioni),carico:e.carico,recupero_secondi:e.recupero_secondi}));
 if(kind==='volume'){let n=Math.floor(p.volume.incremento_numero_ripetizioni_nella_serie),inc=p.volume.incremento_ripetizione;for(let e of affected){let r=reps(e.ripetizioni),cursor=(t.cursor||0)%r.length;for(let j=0;j<Math.min(n,r.length);j++)r[(cursor+j)%r.length]=zero(r[(cursor+j)%r.length]+inc);e.ripetizioni=r}t.cursor=(t.cursor||0)+n}

 events.push({id,parametro:kind,prima:before,dopo:affected.map(e=>({giorno:state.scheda.giorni.find(d=>d.esercizi.includes(e)).id,ripetizioni:clone(e.ripetizioni),carico:e.carico,recupero_secondi:e.recupero_secondi}))});
 }return events}
function complete(){if(locked)return;let a=state.sessione_attiva;if(!a){notify('Avvia una sessione prima di completarla');return}if(a.giorno_id!==selected){alert('Seleziona la giornata della sessione aperta.');return}let xs=a.previsto.esercizi,missing=xs.filter(e=>(a.esiti[e.id]||'da_fare')!=='completato');let msg=`Confermare la sessione ${a.previsto.giorno}?\n\n${missing.length?'Non completati ('+missing.length+'):\n'+missing.map(e=>'• '+e.nome+' — '+({da_fare:'da fare',saltato:'saltato',parziale:'parziale'})[a.esiti[e.id]||'da_fare']).join('\n'):'Tutti gli esercizi risultano completati.'}\n\nSolo i completati non esclusi avanzano. Le voci da fare restano non eseguite.`;
 if(!confirm(msg))return;locked=true;try{if(!state.sessione_attiva||state.sessione_attiva.id!==a.id)return;let before={scheda:clone(state.scheda),meta:clone(state.meta),periodo:clone(state.periodo)};let events=applyProgress(a);
 state.periodo.completate++;state.scheda.stato_progressione.totale_sessioni_completate++;state.scheda.stato_progressione.sessione_corrente++;let record={id:a.id,giorno_id:a.giorno_id,inizio:a.inizio,fine:new Date().toISOString(),previsto:clone(a.previsto),esiti:clone(a.esiti),parametro:state.scheda.progressione.parametro_attivo,progressioni:events,prima_conferma:before};state.storico.push(record);state.sessione_attiva=null;if(!persist()){state.scheda=before.scheda;state.meta=before.meta;state.periodo=before.periodo;state.storico.pop();state.sessione_attiva=a;return}render();notify('Sessione salvata · '+events.length+' progressioni')}finally{locked=false}}
function reopen(){if(locked)return;let r=state.storico.at(-1);if(!r){alert('Nessuna sessione da riaprire.');return}if(state.sessione_attiva){alert('Chiudi o annulla prima la sessione attiva.');return}if(!r.prima_conferma){alert('Questa sessione importata non contiene un punto di ripristino.');return}
 if(!confirm('Riaprire l’ultima sessione ('+r.previsto.giorno+')? Saranno annullati il suo storico e le sue progressioni. Anche le modifiche alla scheda fatte dopo quella conferma verranno annullate.'))return;
 locked=true;try{let backup=clone(state);state.scheda=clone(r.prima_conferma.scheda);state.meta=clone(r.prima_conferma.meta);state.periodo=clone(r.prima_conferma.periodo);state.sessione_attiva={id:r.id,giorno_id:r.giorno_id,inizio:r.inizio,previsto:clone(r.previsto),esiti:clone(r.esiti)};state.storico.pop();selected=r.giorno_id;if(!persist()){state=backup;return}render();notify('Sessione riaperta: puoi correggere le spunte')}finally{locked=false}}
function show(content){$('dialogContent').innerHTML=content;$('dialog').showModal()}
function close(){$('dialog').close()}
function edit(id){let original=day().esercizi.find(e=>e.id===id);if(!original)return;let e=clone(original);let field=(label,key,type='text')=>`<label class="field">${label}<input name="${key}" type="${type}" ${type==='number'?'min="0" step="any"':''} value="${esc(e[key])}"></label>`;
 show(`<h2>Modifica esercizio</h2><p class="muted">ID stabile: ${esc(e.id)}. Se la sessione è aperta, le modifiche valgono dalla prossima.</p><form id="editForm">${field('Nome','nome')}<label class="field">Descrizione<textarea name="descrizione">${esc(e.descrizione)}</textarea></label><div class="grid">${field('Focus primario','focus_muscoli_primario')}${field('Focus secondario','focus_muscoli_secondario')}</div><label class="field">Note e impostazioni<textarea name="note_impostazioni_macchinario_esercizio">${esc(e.note_impostazioni_macchinario_esercizio)}</textarea></label>${field('Link video YouTube','link_video')}<div class="grid3"><label class="field">Ripetizioni per serie (es. 10,10,10)<input name="ripetizioni" value="${esc(reps(e.ripetizioni).join(','))}" required></label>${field('Carico (kg)','carico','number')}${field('Recupero (s)','recupero_secondi','number')}</div><label class="field"><span><input type="checkbox" name="exclude" ${e.escludi_progressione?'checked':''}> Escludi dalla progressione</span></label><details><summary>Altri campi JSON (avanzato)</summary><p class="muted">Puoi modificare altri campi dell'esercizio; l'ID resta bloccato.</p><textarea name="extra" class="field" style="width:100%;min-height:90px">${esc(JSON.stringify(Object.fromEntries(Object.entries(e).filter(([k])=>!['id','ordine','nome','descrizione','focus_muscoli_primario','focus_muscoli_secondario','note_impostazioni_macchinario_esercizio','link_video','ripetizioni','carico','recupero_secondi','escludi_progressione'].includes(k))),null,2))}</textarea></details><div class="modalmenu"><button type="button" class="danger" data-action="delete" data-id="${esc(id)}">Elimina</button><button type="button" data-action="close">Annulla</button><button class="primary" type="submit">Salva modifiche</button></div></form>`);
 $('editForm').onsubmit=ev=>{ev.preventDefault();try{let f=new FormData(ev.target),values=String(f.get('ripetizioni')).split(',').map(x=>Number(x.trim()));if(!values.length||values.some(x=>!Number.isFinite(x)||x<0||String(f.get('ripetizioni')).split(',').some(v=>!v.trim())))throw Error('Le ripetizioni devono essere numeri non negativi separati da virgole.');let extra=JSON.parse(f.get('extra'));if(!extra||Array.isArray(extra)||typeof extra!=='object'||'id'in extra)throw Error('I campi aggiuntivi devono essere un oggetto JSON senza ID.');let next={...e,...extra};for(let k of ['nome','descrizione','focus_muscoli_primario','focus_muscoli_secondario','note_impostazioni_macchinario_esercizio','link_video'])next[k]=String(f.get(k));next.ripetizioni=values;next.carico=Number(f.get('carico'));next.recupero_secondi=Number(f.get('recupero_secondi'));next.escludi_progressione=f.has('exclude');next.id=e.id;let backup=clone(state);Object.assign(original,next);let errors=validate(state);if(errors.length){state=backup;throw Error(errors.join('\n'))}if(!persist()){state=backup;return}close();render();notify('Esercizio aggiornato')}catch(error){alert(error.message)}}}
function settings(){let p=state.scheda.progressione,period=state.periodo;show(`<h2>Progressione</h2><p class="muted">Un solo parametro per tutti gli esercizi. La soglia conta i completamenti effettivi di ogni ID; parziali e saltati non contano. Durata 0 = senza scadenza.</p><form id="settingsForm"><label class="field">Nome scheda<input name="nome" value="${esc(state.scheda.nome)}"></label><label class="field">Frequenza settimanale<input name="frequenza" type="number" min="0" step="1" value="${esc(state.scheda.frequenza)}"></label><label class="field">Parametro attivo<select name="active">${['volume','carico','recupero'].map(k=>`<option value="${k}" ${p.parametro_attivo===k?'selected':''}>${k}</option>`).join('')}</select></label><label class="field">Durata del periodo (sessioni confermate)<input name="duration" type="number" min="0" step="1" value="${period.durata_sessioni}"></label><p class="muted">Periodo corrente: ${period.completate} sessioni confermate. Cambiare parametro o durata avvia un nuovo periodo; i contatori per esercizio restano invariati.</p><hr class="divider"><h3>Volume</h3><div class="grid3">${num('Serie incrementate per passo','vsets',p.volume.incremento_numero_ripetizioni_nella_serie)}${num('Ripetizioni aggiunte','vrep',p.volume.incremento_ripetizione)}${num('Completamenti per passo','vafter',threshold(p.volume))}</div><h3>Carico</h3><div class="grid">${num('Kg aggiunti','ckg',p.carico.incremento_kg)}${num('Completamenti per passo','cafter',threshold(p.carico))}</div><h3>Recupero</h3><div class="grid">${num('Secondi sottratti','rsec',p.recupero.riduzione_secondi)}${num('Completamenti per passo','rafter',threshold(p.recupero))}</div><div class="modalmenu"><button type="button" data-action="close">Annulla</button><button class="primary" type="submit">Salva impostazioni</button></div></form>`);
 $('settingsForm').onsubmit=ev=>{ev.preventDefault();let f=new FormData(ev.target),n=k=>Number(f.get(k));let vals=['frequenza','duration','vsets','vrep','vafter','ckg','cafter','rsec','rafter'].map(n);if(vals.some(v=>!Number.isFinite(v)||v<0)||!['vsets','vafter','cafter','rafter','frequenza','duration'].every(k=>Number.isInteger(n(k))))return alert('Inserisci numeri non negativi; durata, frequenza, serie e soglie devono essere interi.');let backup=clone(state),changed=p.parametro_attivo!==f.get('active')||period.durata_sessioni!==n('duration');state.scheda.nome=String(f.get('nome'));state.scheda.frequenza=n('frequenza');p.parametro_attivo=String(f.get('active'));period.durata_sessioni=n('duration');if(changed)period.completate=0;Object.assign(p.volume,{incremento_numero_ripetizioni_nella_serie:n('vsets'),incremento_ripetizione:n('vrep'),incremento_dopo_numero_esercizi:n('vafter'),incremento_dopo_numero_sessioni:n('vafter')});Object.assign(p.carico,{incremento_kg:n('ckg'),incremento_dopo_numero_esercizi:n('cafter'),incremento_dopo_numero_sessioni:n('cafter')});Object.assign(p.recupero,{riduzione_secondi:n('rsec'),incremento_dopo_numero_esercizi:n('rafter'),incremento_dopo_numero_sessioni:n('rafter')});if(!persist()){state=backup;return}close();render()}}
function num(label,name,value){return `<label class="field">${label}<input name="${name}" type="number" min="0" step="any" value="${esc(value)}" required></label>`}
function editday(){let d=day();show(`<h2>Giornata ${esc(d.id)}</h2><form id="dayForm"><label class="field">Nome<input name="name" value="${esc(d.giorno)}"></label><label class="field">Focus (separati da virgola)<input name="focus" value="${esc(d.focus.join(', '))}"></label><div class="modalmenu"><button type="button" data-action="close">Annulla</button><button class="primary">Salva</button></div></form>`);$('dayForm').onsubmit=ev=>{ev.preventDefault();let f=new FormData(ev.target),backup=clone(state);d.giorno=String(f.get('name'));d.focus=String(f.get('focus')).split(',').map(x=>x.trim()).filter(Boolean);if(!persist()){state=backup;return}close();render()}}
function add(){let d=day(),id=uid();d.esercizi.push({id,ordine:d.esercizi.length+1,nome:'Nuovo esercizio',descrizione:'',focus_muscoli_primario:'',focus_muscoli_secondario:'',note_impostazioni_macchinario_esercizio:'',link_video:'',ripetizioni:[10],recupero_secondi:60,carico:0,escludi_progressione:false});if(!persist()){d.esercizi.pop();return}render();edit(id)}
function exportJson(data,name){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
function history(){show(`<h2>Storico e copie</h2><p class="muted">Puoi riaprire soltanto l'ultima sessione, così la progressione delle successive non diventa incoerente.</p><div class="actions"><button data-action="reopen" ${!state.storico.length||state.sessione_attiva?'disabled':''}>Riapri ultima sessione</button><button data-action="export">Esporta tutto</button></div><hr class="divider"><h3>Sessioni (${state.storico.length})</h3>${state.storico.slice().reverse().map(r=>`<details class="history"><summary>${esc(r.previsto?.giorno||r.giorno_id)} · ${esc(new Date(r.fine).toLocaleString('it-IT'))} · ${esc(r.parametro)}</summary><p>ID sessione: ${esc(r.id)}</p><p>${(r.previsto?.esercizi||[]).map(e=>`${esc(e.nome)}: ${esc(({completato:'completato',parziale:'parziale',saltato:'saltato',da_fare:'da fare'})[r.esiti?.[e.id]||'da_fare'])} (${esc(reps(e.ripetizioni).join('/'))} rip., ${esc(e.carico)} kg)`).join('<br>')}</p><p>Progressioni: ${esc((r.progressioni||[]).map(x=>x.id+' '+x.parametro).join(', ')||'nessuna')}</p></details>`).join('')||'<p class="muted">Nessuna sessione completata.</p>'}<hr class="divider"><h3>Copie prima delle importazioni (${state.copie.length})</h3>${state.copie.map((c,i)=>`<div class="history"><span>${esc(c.data)} · ${esc(c.scheda?.nome||'Scheda')}</span> <button class="small" data-action="restore" data-index="${i}">Ripristina</button> <button class="small" data-action="exportcopy" data-index="${i}">Scarica</button></div>`).join('')||'<p class="muted">Nessuna copia locale.</p>'}<div class="modalmenu"><button data-action="close">Chiudi</button></div>`)}
function updateTimer(){if(timer.running)timer.remaining=Math.max(0,Math.ceil((timer.until-Date.now())/1000));$('timerClock').textContent=String(Math.floor(timer.remaining/60)).padStart(2,'0')+':'+String(timer.remaining%60).padStart(2,'0');$('timerLabel').textContent=timer.label;$('timer').classList.toggle('hide',!timer.id);$('timer').querySelector('[data-action="timerpause"]').textContent=timer.running?'Pausa':'Riprendi';if(timer.id&&timer.running&&timer.remaining===0){timer.running=false;notify('Recupero terminato');if(navigator.vibrate)navigator.vibrate(150)}}setInterval(updateTimer,250);
function handle(action,el){let id=el.dataset.id;
 if(action==='day'){selected=id;render()}else if(action==='check')setStatus(id,el.checked?'completato':'da_fare');else if(action==='status'){let e=currentExercises().find(x=>x.id===id);setStatus(id,statusFor(e)===el.dataset.status?'da_fare':el.dataset.status)}
 else if(action==='video'){let e=currentExercises().find(x=>x.id===id),u=e&&video(e.link_video);if(u)window.open(u,'_blank','noopener,noreferrer')}
 else if(action==='timer'){let e=currentExercises().find(x=>x.id===id);if(e){timer={id:e.id,label:e.nome,total:Math.ceil(e.recupero_secondi),remaining:Math.ceil(e.recupero_secondi),until:Date.now()+Math.ceil(e.recupero_secondi)*1000,running:true};updateTimer()}}
 else if(action==='timerpause'){if(timer.running){timer.remaining=Math.max(0,Math.ceil((timer.until-Date.now())/1000));timer.running=false}else{timer.until=Date.now()+timer.remaining*1000;timer.running=true}updateTimer()}
 else if(action==='timerreset'){timer.remaining=timer.total;timer.until=Date.now()+timer.total*1000;timer.running=true;updateTimer()}else if(action==='timerclose'){timer.id=null;timer.running=false;updateTimer()}
 else if(action==='complete')complete();else if(action==='restart'){if(state.sessione_attiva){if(!confirm('Annullare la sessione in corso? Le spunte andranno perse.'))return;state.sessione_attiva=null;if(!persist())return;render()}else{startSession();render();notify('Sessione iniziata')}}
 else if(action==='edit')edit(id);else if(action==='settings')settings();else if(action==='editday')editday();else if(action==='add')add();else if(action==='close')close();else if(action==='history')history();else if(action==='reopen'){close();reopen()}
 else if(action==='move'){let d=day(),i=d.esercizi.findIndex(x=>x.id===id),j=i+Number(el.dataset.dir);if(i<0||j<0||j>=d.esercizi.length||state.sessione_attiva)return;[d.esercizi[i],d.esercizi[j]]=[d.esercizi[j],d.esercizi[i]];d.esercizi.forEach((e,k)=>e.ordine=k+1);persist();render()}
 else if(action==='delete'){if(!confirm('Eliminare questo esercizio dalla scheda? Lo storico rimane invariato.'))return;let d=day(),i=d.esercizi.findIndex(e=>e.id===id);if(i<0)return;let removed=d.esercizi.splice(i,1)[0];d.esercizi.forEach((e,k)=>e.ordine=k+1);if(!persist()){d.esercizi.splice(i,0,removed);return}close();render()}
 else if(action==='export'){exportJson(state,'backup-allenamento-'+new Date().toISOString().slice(0,10)+'.json');notify('Backup scaricato')}
 else if(action==='import')$('importFile').click();else if(action==='restore'||action==='exportcopy'){let c=state.copie[Number(el.dataset.index)];if(!c)return;if(action==='exportcopy'){exportJson(c,'copia-allenamento.json');return}if(!confirm('Ripristinare questa copia? La scheda corrente sarà conservata come copia locale.'))return;let next=normalize(c),old=clone(state);next.copie=old.copie.filter((_,i)=>i!==Number(el.dataset.index));next.copie.push({data:new Date().toISOString(),...Object.fromEntries(Object.entries(old).filter(([k])=>k!=='copie'))});next.copie=next.copie.slice(-5);if(validate(next).length){alert('La copia non è valida.');return}state=next;selected=state.scheda.giorni[0].id;if(!persist()){state=old;return}close();render()}
}
document.addEventListener('click',ev=>{let el=ev.target.closest('[data-action]');if(el&&el.type!=='checkbox')handle(el.dataset.action,el)});document.addEventListener('change',ev=>{if(ev.target.dataset.action==='check')handle('check',ev.target)});
$('importFile').addEventListener('change',async ev=>{let file=ev.target.files[0];ev.target.value='';if(!file)return;try{let raw=JSON.parse(await file.text()),errors=validate(raw);if(errors.length)throw Error(errors.join('\n'));let next=normalize(raw);show(`<h2>Importa ${esc(file.name)}</h2><p>Il JSON è valido. Come vuoi procedere?</p><p class="muted">Sostituire elimina i dati correnti da questo browser. Conservare una copia salva la situazione attuale fra le copie locali (massimo 5); esporta anche un backup per sicurezza.</p><div class="modalmenu"><button data-action="close">Annulla</button><button id="replaceImport">Sostituisci</button><button class="primary" id="copyImport">Conserva copia e sostituisci</button></div>`);
 for(let [button,copy] of [['replaceImport',false],['copyImport',true]])$(button).onclick=()=>{if(!confirm('Confermi l’importazione?'))return;let old=state;next.copie=copy?[...(old.copie||[]),{data:new Date().toISOString(),...Object.fromEntries(Object.entries(clone(old)).filter(([k])=>k!=='copie'))}].slice(-5):(next.copie||[]);state=next;selected=state.scheda.giorni[0].id;if(!persist()){state=old;return}close();render();notify('Importazione completata')};
 }catch(e){alert('Importazione annullata. Correggi il JSON:\n'+e.message)}});
render();try{$('saveStatus').textContent=localStorage.getItem(KEY)?'Dati caricati dal browser':'Scheda incorporata · non ancora salvata'}catch{$('saveStatus').textContent='Salvataggio locale non disponibile: esporta un backup';$('saveStatus').className='save error'}
</script></body></html>
